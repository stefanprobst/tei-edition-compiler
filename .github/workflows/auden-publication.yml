name: Pinned Auden publication

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/auden-publication.yml
      - .bun-version
      - bun.lock
      - package.json
      - tsconfig.json
      - corpora/auden-musulin/**
      - packages/compiler/**
      - packages/ir/**
      - packages/site/**

permissions:
  contents: read

concurrency:
  group: auden-publication-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publication:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: Explicitly fetch and verify pinned source bytes
        run: bun run amp:fetch
      - name: Verify two clean local publication builds
        run: bun run amp:reproduce
