name: Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - name: Build reference readers
        run: bun run viewer:build
      - name: Build independent static publication studies
        run: |
          bun run site:prepare
          bun run site:build
          bun run site:prepare-pair
          bun run site:build-pair
          bun run site:prepare-akademie
          bun run site:build-akademie
